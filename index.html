<!DOCTYPE html>
<html>
<head>
<title>Number Guessing Game</title>
<style>
body { font-family: Arial; text-align: center; margin-top: 50px; background: #f0f0f0; }
.box { background: white; padding: 30px; border-radius: 10px; display: inline-block; }
input { padding: 10px; font-size: 18px; width: 100px; text-align: center; }
button { padding: 10px 20px; font-size: 18px; background: #2da44e; color: white; border: none; border-radius: 5px; }
#message { font-size: 20px; margin-top: 20px; }
</style>
</head>
<body>

<div class="box">
<h1>🎯 Number Guessing Game</h1>
<p>I'm thinking of a number between 1 and 100</p>

<input type="number" id="guess" placeholder="1-100">
<br><br>
<button onclick="checkGuess()">Guess</button>
<button onclick="newGame()">New Game</button>

<p id="message">Good luck!</p>
<p id="tries">Tries: 0</p>
</div>

<script>
let secret = Math.floor(Math.random() * 100) + 1;
let tries = 0;

function checkGuess() {
  let g = document.getElementById('guess').value;
  if (g == "") { document.getElementById('message').innerText = "Enter a number first!"; return; }
  tries++;
  document.getElementById('tries').innerText = "Tries: " + tries;
  if (g == secret) {
    document.getElementById('message').innerText = "🎉 Correct! You got it in " + tries + " tries!";
  } else if (g < secret) {
    document.getElementById('message').innerText = "Too low! Try higher ⬆️";
  } else {
    document.getElementById('message').innerText = "Too high! Try lower ⬇️";
  }
  document.getElementById('guess').value = "";
}

function newGame() {
  secret = Math.floor(Math.random() * 100) + 1;
  tries = 0;
  document.getElementById('tries').innerText = "Tries: 0";
  document.getElementById('message').innerText = "New game! Good luck!";
}
</script>

</body>
</html>
